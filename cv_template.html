        body {

            background-color: #ccc;

        .sidebar > * {
            position: relative;
            z-index: 1;
        }

        .main-content {
            width: 65%;
            background-color: #f8f9fa;
            padding: 15px 20px 15px 30px;
            box-sizing: border-box;
            position: relative;
        }

        .profile-image {
            position: absolute;
            top: 30px;
            right: 30px;

        body.cv-gamedev-mode .cv-3d {

        .experience-bar {
            display: flex;
            box-sizing: border-box;
            height: 24px;
            overflow: hidden;
            border: 1px solid #fff;
        }

        .experience-segment {
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            color: #fff;
            font-size: 0.72rem;

        .experience-segment-work {

        .experience-legend {
            display: grid;
            gap: 7px;
            margin: 12px 0 0;
            padding: 0;
            list-style: none;
        }

        .experience-legend li {
            display: grid;
            grid-template-columns: 14px 1fr auto;
            align-items: center;
            gap: 7px;
            margin: 0;

        .experience-swatch {
            width: 14px;
            height: 14px;
            box-sizing: border-box;
            border: 1px solid #fff;

            margin-top: 12px;
            line-height: 1.45;
        }

        .skills-page-heading {
            margin-bottom: 6px !important;
            padding-right: 0 !important;
        }

        .skills-page-intro {
            margin: 0 0 20px;
            color: #46515c;
            line-height: 1.45;
        }

        .skill-detail {

        .key-project {
